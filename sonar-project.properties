sonar.projectKey=Takishima_cmake-pre-commit-hooks
sonar.organization=takishima

# NB: the release automation scripts in .github/scripts are tested, but not part of the coverage report
sonar.coverage.exclusions=tests/**,setup.py,.github/**
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version = 3

sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# This project is a library and its CI is meant to test against the latest releases of its dependencies:
#   - text:S8565: no lock file for the Python dependencies
#   - githubactions:S8544: `pip install` without locked versions in workflows
#   - githubactions:S8541: `pip install` without `--only-binary :all:` in workflows (the package itself and some
#     tools are installed from source)
#
# GitHub Actions are referenced by their major version tag so that they get bug and security fixes without a pull
# request for each of their releases:
#   - githubactions:S7637: GitHub Actions not pinned to a full commit SHA
sonar.issue.ignore.multicriteria=nolock,cipiplock,cipipbinary,cisha
sonar.issue.ignore.multicriteria.nolock.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.nolock.resourceKey=pyproject.toml
sonar.issue.ignore.multicriteria.cipiplock.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.cipiplock.resourceKey=.github/workflows/*.yml
sonar.issue.ignore.multicriteria.cipipbinary.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.cipipbinary.resourceKey=.github/workflows/*.yml
sonar.issue.ignore.multicriteria.cisha.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.cisha.resourceKey=.github/workflows/*.yml
