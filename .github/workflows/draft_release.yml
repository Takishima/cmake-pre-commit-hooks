---

name: "Draft new release"

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Version to release: "auto" (deduced from the changelog fragments), "patch", "minor", "major"
          or an explicit version such as v1.2.3
        required: true
        default: auto
  schedule:
    # Every Monday: open a release pull request if user-facing changes are waiting to be released
    - cron: '23 5 * * 1'

permissions:
  contents: write  # required to push the release branch
  pull-requests: write  # required to open the release pull request

jobs:
  new-release:
    name: "Draft a new release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # NB: sets no version if a scheduled run finds nothing worth releasing, which skips the next steps
      - name: Determine release version
        id: version
        env:
          REQUEST: ${{ github.event.inputs.tag || 'scheduled' }}
        run: python3 .github/scripts/release_version.py "${REQUEST}"

      - name: Collect the changelog fragments into CHANGELOG.md
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 -m pip install towncrier mdformat-gfm
          python3 -m towncrier build --yes --version "${VERSION}"
          python3 -m mdformat CHANGELOG.md

      # yamllint disable rule:line-length
      - name: Create pull request
        if: steps.version.outputs.version
        uses: peter-evans/create-pull-request@v8
        with:
          branch: release/v${{ steps.version.outputs.version }}
          base: main
          commit-message: Preparing release v${{ steps.version.outputs.version }}
          title: Release version v${{ steps.version.outputs.version }}
          reviewers: ${{ github.event_name == 'schedule' && github.repository_owner || github.actor }}
          body: |
            This PR was created by the release workflow here: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.

            The changelog fragments of `changelog.d/` were collected into a new `v${{ steps.version.outputs.version }}` section of the CHANGELOG.
            The package version itself is derived from the Git tag, so there is nothing else to update.

            Merging this PR will build the package, upload it to PyPI and then create the `v${{ steps.version.outputs.version }}` tag and GitHub release.
            Not the right time or the right version number? Close this PR and delete its branch.
