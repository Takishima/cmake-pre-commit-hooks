---

name: CI

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - main
      - develop
      - v*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, windows-latest, macos-latest]
        python:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
        exclude:
          # Python 3.10 has issues on macOS M1 runners (missing gettext/libintl)
          - runs-on: macos-latest
            python: '3.10'

    name: "Unit tests • ${{ matrix.python }} • ${{ matrix.runs-on }} • x64"
    runs-on: ${{ matrix.runs-on }}
    if: >-
      (github.event_name != 'pull_request'
        || (github.event_name == 'pull_request' && github.event.pull_request.merged != true))

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history and tags for SCM versioning to work

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: '**/pyproject.toml'

      - name: Prepare env
        run: python -m pip install -U pytest-github-actions-annotate-failures wheel build

      - name: Build and install package
        run: python -m pip install -e .[test]

      - name: Run Python tests
        run: python -m pytest -v --cov=cmake_pc_hooks --cov-report=xml --cov-report=term-missing --cov-branch

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Save coverage report
        if: matrix.python == '3.11' && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 1

  system-tests:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest, windows-latest, macos-latest]
        python:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
        exclude:
          # Python 3.10 has issues on macOS M1 runners (missing gettext/libintl)
          - runs-on: macos-latest
            python: '3.10'

    name: "System tests ${{ matrix.python }} • ${{ matrix.runs-on }} • x64"
    runs-on: ${{ matrix.runs-on }}
    needs: unit-tests
    if: >-
      (github.event_name != 'pull_request'
        || (github.event_name == 'pull_request' && github.event.pull_request.merged != true))

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history and tags for SCM versioning to work

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: '**/pyproject.toml'

      - name: Prepare env
        run: python -m pip install -U pytest-github-actions-annotate-failures wheel build

      - name: Prepare env (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy cppcheck iwyu
          python -m pip install pytest-github-actions-annotate-failures pre-commit cpplint lizard

      - name: Prepare env (Mac OS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm cppcheck cpplint include-what-you-use pre-commit gnu-sed lizard-analyzer
          ln -s "$(brew --prefix llvm)/bin/clang-tidy" /usr/local/bin/clang-tidy

      # yamllint disable rule:line-length
      - name: Prepare env (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y llvm ninja
          Import-Module "${ENV:ChocolateyInstall}\helpers\chocolateyProfile.psm1"
          Update-SessionEnvironment

          # Restore Python to PATH after Update-SessionEnvironment (it resets PATH from system)
          $env:PATH = "$env:pythonLocation;$env:pythonLocation\Scripts;$env:PATH"

          # Install cppcheck via pip (choco package is broken, pip wheel works correctly)
          python -m pip install pre-commit cpplint lizard cppcheck

          Get-Command @("python", "clang-format", "clang-tidy", "cppcheck", "cpplint", "lizard", "pre-commit")

      # Enable MSVC dev command AFTER chocolatey packages are installed to avoid
      # Update-SessionEnvironment overwriting MSVC environment variables
      - name: Enable Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756  # v1.13.0

      # Restore Python to front of PATH after MSVC setup
      # (MSVC's vcvarsall.bat prepends paths including VS's bundled Python 3.9,
      # which conflicts with our Python 3.10+ requirement)
      - name: Restore Python PATH
        if: runner.os == 'Windows'
        run: |
          "$env:pythonLocation" >> $env:GITHUB_PATH
          "$env:pythonLocation\Scripts" >> $env:GITHUB_PATH
          # Ensure python3 also points to the correct Python (pre-commit looks for python3)
          if (-not (Test-Path "$env:pythonLocation\python3.exe")) {
            Copy-Item "$env:pythonLocation\python.exe" "$env:pythonLocation\python3.exe"
          }

      - name: Build and install package
        run: python -m pip install -e .[test]

      # NB: tests requiring a tool that is not listed in --required-tools are skipped if that tool cannot be found
      - name: Run integration tests (Unix)
        if: runner.os != 'Windows'
        env:
          LOGLEVEL: DEBUG
        run: python -m pytest tests/integration -v -ra --required-tools=all

      - name: Run integration tests (Windows)
        if: runner.os == 'Windows'
        env:
          CC: cl
          CXX: cl
          LOGLEVEL: DEBUG
        run: >-
          python -m pytest tests/integration -v -ra
          --required-tools=clang-format,clang-tidy,cppcheck,cpplint,lizard,cmake,git,pre-commit

  # NB: secrets are not available for pull requests coming from Dependabot or from forks. In those cases the
  #     coverage upload jobs below skip their steps instead of failing.
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check for SonarCloud token
        if: env.SONAR_TOKEN == ''
        run: echo "::notice::SONAR_TOKEN is not available (Dependabot or fork pull request); skipping SonarCloud scan"

      - uses: actions/checkout@v7
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0

      - name: Fetch coverage report
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: SonarQube Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4  # v8.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any

  codacy:
    name: Codacy coverage
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    steps:
      - name: Check for Codacy token
        if: env.CODACY_PROJECT_TOKEN == ''
        run: echo "::notice::CODACY_PROJECT_TOKEN is not available (Dependabot or fork pull request); skipping upload"

      - name: Fetch coverage report
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: Run codacy-coverage-reporter
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699  # v1.3.0
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

  finish:
    needs: [unit-tests, system-tests, sonarcloud, codacy]
    runs-on: ubuntu-latest
    name: Finish CI checks
    # Run even if a dependency failed so that this job fails instead of being skipped (a skipped required check counts
    # as passing), but not when the run was cancelled, e.g. when superseded by a newer commit
    if: ${{ !cancelled() }}
    steps:
      - name: All tests pass
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${NEEDS_RESULTS}"
          for result in ${NEEDS_RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::At least one required job did not succeed"
              exit 1
            fi
          done
          echo 'OK'
