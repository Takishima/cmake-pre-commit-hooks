---

name: "Publish new release"

on:  # yamllint disable-line rule:truthy
  push:
    tags:
      - v[0-9]+.*
  pull_request:
    branches:
      - main
    types:
      - closed

permissions:
  contents: read

jobs:
  build:
    name: Build and check package
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'pull_request' && github.event.pull_request.merged == true
          && (startsWith(github.event.pull_request.head.ref, 'release/')
              || startsWith(github.event.pull_request.head.ref, 'hotfix/')))
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Build exactly what was merged (or tagged), even if `main` has moved on since
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: Extract version from tag or branch name
        id: version
        env:
          # Either "vX.Y.Z" (tag) or "release/vX.Y.Z" or "hotfix/vX.Y.Z" (merged pull request)
          REF_NAME: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          VERSION="${REF_NAME##*/}"
          VERSION="${VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::Unable to extract a valid version from '${REF_NAME}'"
              exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Build wheel and source distribution
        env:
          # The tag does not exist yet when releasing from a pull request
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m pip install build
          python -m build --wheel --sdist

      - name: Check metadata
        run: |
          python -m pip install twine --prefer-binary
          python -m twine check --strict dist/*

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c  # v2.90.8
        with:
          tool: parse-changelog

      - name: Extract release notes from CHANGELOG
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          parse-changelog CHANGELOG.md "${RELEASE_VERSION}" > release_notes.md
          cat release_notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release
          if-no-files-found: error
          path: |
            dist/
            release_notes.md

  pypi:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cmake-pre-commit-hooks/${{ needs.build.outputs.version }}
    permissions:
      id-token: write  # for PyPI trusted publishing (used when no API token is configured)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          password: ${{ secrets.pypi_password }}
          packages-dir: dist/

  github-release:
    name: Create GitHub release
    # Only once the package is on PyPI: unlike a PyPI upload, a GitHub release can be fixed afterwards
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create the tag and the GitHub release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: v${{ needs.build.outputs.version }}
          # Commit to tag when the tag does not exist yet
          target_commitish: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          name: cmake-pre-commit-hooks v${{ needs.build.outputs.version }}
          body_path: release_notes.md
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: dist/*
          fail_on_unmatched_files: true

      - name: Delete release branch
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH_NAME}" \
            || echo "::notice::Branch ${BRANCH_NAME} was already deleted"
