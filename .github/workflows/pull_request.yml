---

name: Pull requests
on:  # yamllint disable-line rule:truthy
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

# Bots add several labels right after opening a pull request, each of which triggers this workflow: only keep the
# latest of those runs. The run for the 'opened' event has its own group since it may push a CHANGELOG update.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.action == 'opened' }}
  cancel-in-progress: true

jobs:
  update-changelog:
    runs-on: ubuntu-latest
    name: "Pre-commit CI CHANGELOG auto-update"
    if: >
      (github.event.pull_request.title == '[pre-commit.ci] pre-commit autoupdate') &&
      (github.event.action == 'opened')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.PRE_COMMIT_CI_CHANGELOG }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/pyproject.toml'

      - name: Install dependencies
        run: |
          python3 -m pip install 'git+https://github.com/Takishima/pre-commit-changelog-auto-update@v1.0.0'

      - name: Run Python script
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 -m update_changelog --pr-body "$PR_BODY"

      - name: Commit changes
        id: commit
        uses: EndBug/add-and-commit@v11
        with:
          author_name: github-actions[bot]
          author_email: noreply@github.com
          message: Update CHANGELOG

  changelog:
    needs: update-changelog
    runs-on: ubuntu-latest
    name: CHANGELOG enforcer
    # Dependabot pull requests cannot update the CHANGELOG themselves; these get documented when merging them
    if: "!cancelled() && github.event.pull_request.user.login != 'dependabot[bot]'"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: dangoslen/changelog-enforcer@v3
        with:
          changeLogPath: 'CHANGELOG.md'
          skipLabels: 'Skip-Changelog'
