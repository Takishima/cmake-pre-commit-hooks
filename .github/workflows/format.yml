---

name: Format

on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
    branches:
      - main
      - "v*"

jobs:
  parse-changelog:
    name: Parse CHANGELOG
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request'
      && (startsWith(github.event.pull_request.head.ref, 'release/')
          || startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c  # v2.90.8
        with:
          tool: parse-changelog

      - name: Check that the release notes can be extracted from the CHANGELOG
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          # CHANGELOG headings are parsed without the leading "v"
          VERSION="${BRANCH_NAME##*/}"
          parse-changelog CHANGELOG.md "${VERSION#v}"
